name: hgct

services:
  postgres:
    image: postgres:16
    container_name: hgct-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nguydev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zodiacdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hgct-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nguydev -d zodiacdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Docker API gateway — restricts what hgct-prod can do via Docker socket.
  # Only Container endpoints + POST methods enabled (restart/start/stop).
  # NO Exec/Images/Networks/Volumes/SystemInfo/Build/Auth/Secrets exposure.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: hgct-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hgct-net
    security_opt:
      - no-new-privileges:true

  hgct-prod:
    build:
      context: ./hgct
      dockerfile: Dockerfile
    container_name: hgct-prod
    restart: unless-stopped
    env_file:
      - ./hgct/.env.local
    environment:
      PORT: "65498"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://nguydev:${POSTGRES_PASSWORD}@postgres:5432/zodiacdb"
      DOCKER_PROXY_HOST: hgct-docker-proxy
      DOCKER_PROXY_PORT: "2375"
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    volumes:
      - ./volumes/pdfs-prod:/var/hgct/pdfs
      - ./volumes/avatars:/var/hgct/avatars
    networks:
      - hgct-net
    security_opt:
      - no-new-privileges:true

  hgct-demo:
    build:
      context: ./hgct-demo
      dockerfile: Dockerfile
    container_name: hgct-demo
    restart: unless-stopped
    env_file:
      - ./hgct-demo/.env.local
    environment:
      PORT: "65500"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://nguydev:${POSTGRES_PASSWORD}@postgres:5432/zodiacdb"
      DOCKER_PROXY_HOST: hgct-docker-proxy
      DOCKER_PROXY_PORT: "2375"
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    volumes:
      - ./volumes/pdfs-demo:/var/hgct/pdfs
      - ./volumes/avatars:/var/hgct/avatars
    networks:
      - hgct-net
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    container_name: hgct-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./volumes/nginx-logs:/var/log/nginx
    depends_on:
      - hgct-prod
      - hgct-demo
    networks:
      - hgct-net

  hgct-cron:
    image: alpine:latest
    container_name: hgct-cron
    restart: unless-stopped
    env_file:
      - ./hgct/.env.local
    volumes:
      - ./cron/start.sh:/cron/start.sh:ro
    command: sh /cron/start.sh
    depends_on:
      - hgct-prod
    networks:
      - hgct-net

networks:
  hgct-net:
    driver: bridge

volumes:
  postgres-data:
