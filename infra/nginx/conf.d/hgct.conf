resolver 127.0.0.11 valid=10s ipv6=off;

# ── SSL common config ────────────────────────────────────────────
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# ── PROD (hatgiongchiemtinh.com) ─────────────────────────────────
server {
    listen 80 default_server;
    server_name hatgiongchiemtinh.com dashboard.hatgiongchiemtinh.com daisu.hatgiongchiemtinh.com admin.hatgiongchiemtinh.com mo.hatgiongchiemtinh.com _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name hatgiongchiemtinh.com dashboard.hatgiongchiemtinh.com daisu.hatgiongchiemtinh.com admin.hatgiongchiemtinh.com mo.hatgiongchiemtinh.com _;

    # Variable forces nginx to use resolver on each request → re-resolves DNS
    # when prod container restarts and gets new docker bridge IP.
    set $upstream_prod "hgct-prod:65498";

    # Safe, non-breaking security headers (HSTS/CSP intentionally deferred —
    # need staged rollout, see docs/GOAL.md).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20M;
    access_log /var/log/nginx/hgct_prod_access.log;
    error_log  /var/log/nginx/hgct_prod_error.log;

    # ── Attack mitigation: block known exploit probe paths ─────────
    # Active botnet (9+ IPs) POST /adfa and similar to trigger Next.js
    # 5xx error.digest exfil channel. Drop connection silently (444 = no response).
    location = /adfa {
        return 444;
    }
    # Block other common WordPress/PHP exploit probes (we're Next.js, no PHP)
    location ~* \.(php|aspx?|cgi|jsp|do|action)$ {
        return 444;
    }
    location ~* ^/(wp-admin|wp-content|wp-includes|wp-login|xmlrpc|cgi-bin|adminer|phpmyadmin|\.env|\.git) {
        return 444;
    }

    # Telegram admin webhook — only allow Telegram IP ranges + rate limit
    location ~ ^/api/telegram-admin/.*/webhook$ {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;
        limit_req zone=tg_webhook burst=20 nodelay;
        proxy_pass http://$upstream_prod$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static {
        proxy_pass http://$upstream_prod$request_uri;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # Coin unlock/gen — long LLM gen. Finish server-side even if the CDN/client
    # drops the connection (Cloudflare 524 at ~100s) so the unlock always commits.
    location /api/coin/ {
        proxy_pass http://$upstream_prod$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_ignore_client_abort on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$upstream_prod$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── DEMO (demo.hatgiongchiemtinh.com) ────────────────────────────
server {
    listen 80;
    server_name demo.hatgiongchiemtinh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name demo.hatgiongchiemtinh.com;

    set $upstream_demo "hgct-demo:65500";

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20M;
    access_log /var/log/nginx/hgct_demo_access.log;
