resolver 127.0.0.11 valid=10s ipv6=off;

# ── SSL common config ────────────────────────────────────────────
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# ── PROD (hatgiongchiemtinh.com) ─────────────────────────────────
server {
    listen 80 default_server;
    server_name hatgiongchiemtinh.com dashboard.hatgiongchiemtinh.com daisu.hatgiongchiemtinh.com admin.hatgiongchiemtinh.com mo.hatgiongchiemtinh.com _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name hatgiongchiemtinh.com dashboard.hatgiongchiemtinh.com daisu.hatgiongchiemtinh.com admin.hatgiongchiemtinh.com mo.hatgiongchiemtinh.com _;

    # Variable forces nginx to use resolver on each request → re-resolves DNS
    # when prod container restarts and gets new docker bridge IP.
    set $upstream_prod "hgct-prod:65498";

    client_max_body_size 20M;
    access_log /var/log/nginx/hgct_prod_access.log;
    error_log  /var/log/nginx/hgct_prod_error.log;

    # Telegram admin webhook — only allow Telegram IP ranges + rate limit
    location ~ ^/api/telegram-admin/.*/webhook$ {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;
        limit_req zone=tg_webhook burst=20 nodelay;
        proxy_pass http://$upstream_prod$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static {
        proxy_pass http://$upstream_prod$request_uri;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://$upstream_prod$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

